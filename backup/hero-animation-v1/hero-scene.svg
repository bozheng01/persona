<svg class="hero-city" preserveaspectratio="xMidYMax slice" viewbox="0 0 1600 180">
<!-- Japanese flat-cartoon scene: amber sky, cream clouds, Mt. Fuji, a red hill
           with a torii and a pagoda, and a cast of three humans + four robots
           standing on the hill. Flat SVG so the sky, cast and petals animate. -->
<defs>
<lineargradient id="hill-grad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#8a2020"></stop>
<stop offset="0.7" stop-color="#701719"></stop>
<stop offset="0.92" stop-color="#d9b8b0"></stop>
<stop offset="1" stop-color="#f7f5ef"></stop>
</lineargradient>
<symbol id="cloud" viewbox="0 0 120 46">
<path d="M20 44 q-18 0 -19 -12 q-1 -12 12 -13 q-2 -15 13 -17 q10 -1 16 7 q9 -8 21 -3 q13 6 9 18 q12 1 10 13 q-1 9 -14 9 z" fill="#fdf3dd"></path>
</symbol>
<symbol id="petal" viewbox="0 0 20 20">
<path d="M10 1 C16 4 18 11 13 16 C12 17.2 10.6 17.6 10 16.4 C9.4 17.6 8 17.2 7 16 C2 11 4 4 10 1 Z" fill="#ffb3c7"></path>
</symbol>
