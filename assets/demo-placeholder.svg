<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#f7e6d2"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58220"/>
      <stop offset="1" stop-color="#c1272d"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <circle cx="150" cy="210" r="190" fill="#f58220" opacity="0.12"/>
  <circle cx="770" cy="1010" r="220" fill="#c1272d" opacity="0.10"/>

  <!-- dashed placeholder frame -->
  <rect x="60" y="60" width="780" height="1080" rx="40" fill="none" stroke="#241e1a" stroke-opacity="0.18" stroke-width="4" stroke-dasharray="18 20"/>

  <!-- figure -->
  <g transform="translate(450 560)">
    <circle cx="0" cy="-250" r="86" fill="#f6d9b8" stroke="#241e1a" stroke-width="6"/>
    <path d="M-86 -186 Q0 -230 86 -186 L118 60 Q0 118 -118 60 Z" fill="url(#cloth)" stroke="#241e1a" stroke-width="6"/>
    <path d="M-52 -150 Q0 -178 52 -150 L70 -30 Q0 6 -70 -30 Z" fill="#ffffff" opacity="0.85"/>
    <rect x="-118" y="60" width="236" height="70" rx="18" fill="#241e1a" opacity="0.85"/>
  </g>

  <!-- outfit swatches -->
  <g transform="translate(180 940)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#ffffff" stroke="#241e1a" stroke-width="5"/>
    <rect x="18" y="18" width="84" height="84" rx="12" fill="#f58220"/>
    <rect x="150" y="0" width="120" height="120" rx="20" fill="#ffffff" stroke="#241e1a" stroke-width="5"/>
    <rect x="168" y="18" width="84" height="84" rx="12" fill="#c1272d"/>
    <rect x="300" y="0" width="120" height="120" rx="20" fill="#ffffff" stroke="#241e1a" stroke-width="5"/>
    <rect x="318" y="18" width="84" height="84" rx="12" fill="#f6d9b8"/>
    <rect x="450" y="0" width="120" height="120" rx="20" fill="#ffffff" stroke="#241e1a" stroke-width="5"/>
    <rect x="468" y="18" width="84" height="84" rx="12" fill="#241e1a"/>
  </g>

  <!-- play badge -->
  <g transform="translate(450 560)">
    <circle cx="0" cy="0" r="96" fill="#c1272d" stroke="#ffffff" stroke-width="8"/>
    <path d="M-28 -44 L52 0 L-28 44 Z" fill="#ffffff"/>
  </g>

  <text x="450" y="1140" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="6" fill="#241e1a" fill-opacity="0.45">DEMO</text>
</svg>
